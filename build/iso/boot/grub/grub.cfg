set timeout=15
set default=0

insmod multiboot
insmod vbe
insmod video_bochs
insmod video_cirrus
insmod gfxterm

set gfxmode=1024x768x32,1024x768x24,1024x768x16,auto
set gfxpayload=keep

# Ровно три пункта ОС.  Пункт 2: журнал ядра ДОПИСЫВАЕТСЯ в файл
# EGOROV.LOG на разделе LOGS специально выделенной флешки (FAT32,
# метка тома «LOGS»), одновременно показывается на экране.  Накопитель
# не найден / раздел не тот / запись не удалась — честные строки на
# экране и в COM1; ОС продолжает работать (RAM-кольцо + COM1 живы).
# [#473] ЭТАП 9/10: в заголовках пунктов — НОМЕР СБОРКИ («Сборка 4»).
# Это ПЕРВОЕ, что видно при загрузке с флешки: если номер старый —
# Rufus/DD записал старый образ, перезапиши флешку.  Номер меняется
# вместе с kernel/version.h (один релиз = один раз).
menuentry "1. Egorov OS 0.3.0 Сборка 4 - LIVE (boot OS from USB stick)" {
    multiboot /boot/egorov.kernel
    boot
}

menuentry "2. Egorov OS 0.3.0 Сборка 4 - LOGS to USB stick (EGOROV.LOG) + SCREEN (diagnostics)" {
    multiboot /boot/egorov.kernel textlog sticklog
    boot
}

menuentry "3. Egorov OS - INSTALL to HDD" {
    multiboot /boot/egorov.kernel install
    boot
}

menuentry "Reboot" {
    reboot
}

menuentry "Power Off" {
    halt
}
